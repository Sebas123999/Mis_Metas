<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Metas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("Pantalla.png")
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        .overlay {
            min-height: 100vh;
            background-color: rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 40px;
        }

        .contenedor {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== BOTONES ===== */
        .card {
            background-color: white;
            padding: 18px;
            border-radius: 18px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1f3c88;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);

            /* Animación */
            opacity: 0;
            transform: translateY(30px);
            animation: aparecer 0.8s ease forwards;
        }

        /* Hover (opcional) */
        .card:active {
            transform: scale(0.97);
        }

        .card:nth-child(1) { animation-delay: 0.3s; }
        .card:nth-child(2) { animation-delay: 0.7s; }
        .card:nth-child(3) { animation-delay: 1.1s; }

        @keyframes aparecer {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            margin-top: 40px;
            padding: 14px 24px;
            background-color: #1f3c88;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="overlay">
    <h1>Mis Metas</h1>

    <div class="contenedor">
        <a href="metas_2_3.html" class="card">Metas de 2 a 3 años</a>
        <a href="metas_3_4.html" class="card">Metas de 3 a 4 años</a>
        <a href="metas_5_mas.html" class="card">Metas de 5 años o más</a>
    </div>

    
</div>

</body>
</html>
